<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick Haven</title>
  <script>
    // GitHub Pages SPA routing — redirect unknown paths back to index.html
    // pathSegmentsToKeep = 0 for user pages (username.github.io)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
