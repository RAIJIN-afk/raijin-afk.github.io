    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var d = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash);
        }
      })(window.location);
    </script>

    <style>
      html.pw-skip #pw-wall {
        display: none;
      }
      #pw-wall {
        position: fixed;
        inset: 0;

        padding: 1rem;
      }
      #pw-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 2.5rem 2rem;

        text-align: center;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      }
      #pw-logo {
        display: block;
        margin: 0 auto 1.25rem;
      }
      #pw-brand {
        font-family: 'Fredoka', sans-serif;
        font-size: 2rem;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 0.25rem;
        letter-spacing: -0.01em;
      }
      #pw-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.875rem;
        color: #64748b;
        margin: 0 0 1.75rem;
      }
      #pw-input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.75rem 1rem;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 1rem;
        color: #0f172a;
        outline: none;
        transition: border-color 0.15s;
        margin-bottom: 0.75rem;
      }
      #pw-input:focus {
        border-color: #0f172a;
      }
      #pw-btn {
        width: 100%;
        padding: 0.75rem;
        background: #d11116;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.9375rem;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: background 0.15s;
      }
      #pw-btn:hover {
        background: #b00d11;
      }
      #pw-btn:active {
        transform: translateY(1px);
      }
      #pw-err {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.8125rem;
        color: #d11116;
        margin-top: 0.625rem;
        min-height: 1.1rem;
      }

    <script>
      (function () {
        var K = 'bh_access_v1';
        var C = 'QnJpY2tIQHZlbg==';
        if (sessionStorage.getItem(K) === C) {
          document.documentElement.classList.add('pw-skip');
          return;
        }
        window.__bhAuth = function () {
          var v = document.getElementById('pw-input').value;
          if (btoa(v) === C) {
            sessionStorage.setItem(K, C);
            document.getElementById('pw-wall').remove();
          } else {
            document.getElementById('pw-err').textContent = 'Incorrect password — try again.';
            document.getElementById('pw-input').value = '';
            document.getElementById('pw-input').focus();
          }
        };
        document.addEventListener('DOMContentLoaded', function () {
          var i = document.getElementById('pw-input');
          if (i) {
            i.focus();
            i.addEventListener('keydown', function (e) {
              if (e.key === 'Enter') window.__bhAuth();
            });
          }
        });
      })();
    </script>
